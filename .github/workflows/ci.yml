name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # The app has no configuration fallbacks (RULES R18) and `next build` imports the auth
    # module, so the build needs these three. They are explicit, non-secret CI values: the
    # database is in-memory PGlite. Unit tests and the E2E server set their own values.
    env:
      DATABASE_URL: pglite://memory
      BETTER_AUTH_SECRET: ci-only-value-not-a-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @clg-ess/web exec playwright install --with-deps chromium

      # Runs against the production build from the previous step (playwright.config.ts).
      # Retries are allowed for diagnosis, but a test that only passes on retry fails the job.
      - name: E2E Tests
        run: pnpm --filter @clg-ess/web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
